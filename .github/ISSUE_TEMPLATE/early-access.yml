name: 申请内测 / Request early access
description: 申请 TheoremOS 在线工作台内测 / Request access to the TheoremOS online workbench
title: "[Early access] "
labels: ["early-access"]
body:
  - type: markdown
    attributes:
      value: |
        在线工作台已开放白名单 Beta。说明研究用途即可，可选附公开题目或 Lean 声明链接。
        The workbench is open as an allowlist beta. Describe your research use; public problem or Lean statement links are optional.

        审核后，我们会在本 Issue 回复。请按回复指引通过邮件私下确认登录邮箱。获准加入白名单后，用邮箱验证码登录，再连接模型并设置预算。
        After review, we will reply in this issue. Follow the reply to confirm your sign-in address privately by email. Once approved and added to the allowlist, sign in with an emailed code, then connect your model and set your budgets.

        **这条 Issue 会公开显示。请勿填写 API Key、访问令牌、邮箱、电话等个人信息。**
        **This issue is public. Do not include API keys, access tokens, email addresses, phone numbers or other personal information.**

        不使用 GitHub 或希望私下申请，可发邮件至 liuzhenhao@westlake.edu.cn。
        To apply privately, email liuzhenhao@westlake.edu.cn.
  - type: dropdown
    id: role
    attributes:
      label: 身份 / Role
      options:
        - 数学研究者或学生 / Mathematician or student
        - Lean / Mathlib 开发者 / Lean or Mathlib developer
        - 数学 Agent 研究者 / Math agent researcher
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: 研究用途 / Research use
      description: 你想用 TheoremOS 研究什么？/ What would you like to study with TheoremOS?
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: 想做的题目 / Problems
      description: 公开题目名称、来源或 Lean 声明链接（选填）/ Public problem names, sources or Lean statement links (optional)
  - type: dropdown
    id: model
    attributes:
      label: 计划使用的模型服务 / Model service
      options:
        - OpenAI
        - 兼容 Responses API 的服务 / A service compatible with the Responses API
        - 还没确定 / Not sure yet
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认 / Confirmation
      options:
        - label: 我没有填写 API Key 或个人联系方式 / I have not included API keys or personal contact details
          required: true
